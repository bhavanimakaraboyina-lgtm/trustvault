
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - TrustVault</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .password-card {
            background: #1e293b;
            width: 90%;
            max-width: 420px;
            padding: 30px;
            border-radius: 14px;
            border: 1px solid #334155;
        }

        h2 {
            text-align: center;
            color: #38bdf8;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            color: white;
            border: 1px solid #475569;
            border-radius: 7px;
        }

        input:focus {
            outline: 2px solid #38bdf8;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 12px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #0369a1;
        }

        a {
            display: block;
            text-align: center;
            color: #38bdf8;
            margin-top: 20px;
        }

        .message {
            color: #fbbf24;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="password-card">
        <h2>Change Your Password</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label>Current Password</label>
            <input type="password" name="current_password" required>

            <label>New Password</label>
            <input type="password" name="new_password" required>

            <label>Confirm New Password</label>
            <input type="password" name="confirm_password" required>

            <button type="submit">Update Password</button>
        </form>

        <a href="{{ url_for('documents.dashboard') }}">Back to Dashboard</a>
    </div>
</body>
</html>
