
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustVault | Login</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            color: #e5f5ed;
            background: #061b16;
        }

        .container {
            width: 100%;
            max-width: 460px;
            padding: 34px;
            border: 1px solid #1d5945;
            border-radius: 18px;
            background: #0b2920;
            box-shadow: 0 15px 45px rgba(0,0,0,.3);
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand h1 {
            margin: 0 0 8px;
            color: #62d6a1;
            font-size: 30px;
        }

        .brand p {
            margin: 0;
            color: #a9c8b9;
            font-size: 14px;
        }

        h2 {
            margin: 0 0 15px;
            font-size: 18px;
        }

        .roles {
            display: grid;
            gap: 10px;
            margin-bottom: 22px;
        }

        .role-option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            border: 1px solid #285b48;
            border-radius: 10px;
            cursor: pointer;
            background: #10372a;
        }

        .role-option:has(input:checked) {
            border-color: #62d6a1;
            background: #174634;
        }

        .role-option input {
            accent-color: #62d6a1;
        }

        .role-option span {
            font-weight: bold;
        }

        label.field-label {
            display: block;
            margin: 16px 0 7px;
            color: #c6dfd2;
            font-size: 14px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 13px;
            border: 1px solid #35634f;
            border-radius: 8px;
            outline: none;
            color: white;
            background: #071f18;
        }

        input:focus {
            border-color: #62d6a1;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            color: #062116;
            background: #62d6a1;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover { background: #82e5b8; }

        .links {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            line-height: 2;
        }

        a {
            color: #75dfad;
            text-decoration: none;
        }

        .message {
            padding: 10px;
            margin-bottom: 12px;
            border-radius: 7px;
            background: #174634;
            color: #d8f5e5;
            font-size: 14px;
        }

        .error { background: #552b2b; color: #ffdada; }
        .warning { background: #59491f; color: #fff0bd; }
    </style>
</head>
<body>
    <main class="container">
        <div class="brand">
            <h1>TrustVault</h1>
            <p>Secure Document Management Platform</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="message {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <h2>Select your login type</h2>

            <div class="roles">
                <label class="role-option">
                    <input type="radio" name="login_role" value="admin" required>
                    <span>Administrator</span>
                </label>

                <label class="role-option">
                    <input type="radio" name="login_role" value="owner" required>
                    <span>Document Owner</span>
                </label>

                <label class="role-option">
                    <input type="radio" name="login_role" value="viewer" required>
                    <span>Viewer / User</span>
                </label>
            </div>

            <label class="field-label" for="email">Email address</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>

            <label class="field-label" for="password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="Enter your password" required>

            <button type="submit">Sign In</button>
        </form>

        <div class="links">
            <a href="{{ url_for('auth.forgot_password') }}">Forgot Password?</a>
            <br>
            Don't have an account?
            <a href="{{ url_for('auth.register') }}">Create Account</a>
        </div>
    </main>
</body>
</html>
